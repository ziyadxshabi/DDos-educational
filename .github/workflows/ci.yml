name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check hydra
      - run: python -c "import hydra.cli, hydra.context, hydra.packets, hydra.runtime, hydra.vectors"
      - run: python -m hydra --help